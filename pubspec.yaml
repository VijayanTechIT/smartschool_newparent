    ssv:
       app:
         name: "SSV Sivagiri"
         icon: "./images/ssvSchool.jpeg"
       android:
         applicationId: "com.vijayantech.ssv_sivagiri"
         firebase:
            config: "./lib/config/google-services.json"
    mrs:
      app:
        name: "MRS"
        icon: "./images/mrsLogo.png"
      android:
        applicationId: "com.vijayantech.mrs"
        firebase:
          config: "./lib/config/google-services.json"
    mySchool:
      app:
        name: "My School"
